<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Locutor — ¡Ya eres Premium!</title>
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#141109" />
<style>
  :root{--bg:#0E0A08;--surface:#191210;--line:#3B2B21;--text:#EFE7DA;--dim:#8C7B6D;--amber:#F4A52A;--amber2:#FFC15E;--green:#3FBF7F}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;
    background-image:radial-gradient(700px 360px at 50% 0%, rgba(63,191,127,.14), transparent 70%)}
  .box{max-width:460px}
  .badge{width:78px;height:78px;border-radius:50%;background:rgba(63,191,127,.14);color:var(--green);
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:38px;
    animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  h1{font-size:30px;margin:0 0 12px;letter-spacing:-.01em}
  p{color:var(--dim);font-size:16px;line-height:1.6;margin:0 0 12px}
  .note{font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:22px 0;color:#D8CFC0}
  .btn{display:inline-block;background:var(--amber);color:#211404;font-weight:700;padding:13px 26px;border-radius:9px;font-size:15px;text-decoration:none;transition:background .12s}
  .btn:hover{background:var(--amber2)}
  .brand{margin-top:32px;font-family:ui-monospace,monospace;letter-spacing:.16em;font-size:13px;color:var(--dim)}
</style>
</head>
<body>
  <div class="box">
    <div class="badge">★</div>
    <h1>¡Ya eres Premium!</h1>
    <p>El pago se ha completado. Gracias por apoyar Locutor.</p>
    <div class="note">Vuelve a la app de <b style="color:var(--text)">Locutor</b>: tu Premium se activa solo en cuanto la abras. Si no aparece al momento, espera unos segundos o reinicia la app.</div>
    <a class="btn" href="index.html">Volver al inicio</a>
    <div class="brand">◉ LOCUTOR</div>
  </div>
</body>
</html>
